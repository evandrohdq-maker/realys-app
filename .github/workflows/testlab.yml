name: Testar o APK em celulares (Firebase Test Lab)

# Depois que o APK novo fica pronto, o Firebase Test Lab instala ele num celular Android do Google e um
# robô vai tocando nas telas, procurando travamentos. O relatório fica no resumo desta execução (aba
# Actions) e no console do Firebase (projeto realyz-70ae7 › Test Lab).
# Precisa do segredo FIREBASE_TESTLAB_KEY (chave JSON da conta de serviço) em Settings › Secrets › Actions.
on:
  workflow_run:
    workflows: ['Gerar APK do Re@lys']
    types: [completed]
  # Rodar na mão (aba Actions): testa o último APK gerado.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  robo:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEM_CHAVE: ${{ secrets.FIREBASE_TESTLAB_KEY != '' }}
    steps:
      - name: Conferir a chave do Firebase
        if: env.TEM_CHAVE != 'true'
        run: |
          echo "### Test Lab desligado" >> $GITHUB_STEP_SUMMARY
          echo "Falta o segredo FIREBASE_TESTLAB_KEY no GitHub." >> $GITHUB_STEP_SUMMARY

      - name: Achar o APK (o que acabou de sair ou, na mão, o último que deu certo)
        if: env.TEM_CHAVE == 'true'
        id: apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id="${{ github.event.workflow_run.id }}"
          if [ -z "$id" ]; then
            id=$(gh api "repos/${{ github.repository }}/actions/workflows/build-apk.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
          fi
          echo "id=$id" >> $GITHUB_OUTPUT

      - name: Baixar o APK
        if: env.TEM_CHAVE == 'true'
        uses: actions/download-artifact@v4
        with:
          name: realys-demo-apk
          run-id: ${{ steps.apk.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Entrar no Google Cloud
        if: env.TEM_CHAVE == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_TESTLAB_KEY }}

      - name: Instalar o gcloud
        if: env.TEM_CHAVE == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Robô do Test Lab (tocando nas telas por 5 minutos)
        if: env.TEM_CHAVE == 'true'
        env:
          U: ${{ secrets.TESTLAB_USUARIO }}
          P: ${{ secrets.TESTLAB_SENHA }}
        run: |
          set +e
          # Com a conta do robô nos segredos, ele entra logado antes de andar pelas telas.
          if [ -n "$U" ] && [ -n "$P" ]; then LOGIN_ROBO="text:login_usuario=$U,text:login_senha=$P,click:login_entrar="; fi
          # Pasta própria de resultados no projeto (a pasta padrão do Test Lab fica fora do nosso projeto
          # e recusa a conta do robô). Cria uma vez; nas próximas já existe.
          BUCKET="gs://realyz-70ae7-testlab"
          gcloud storage buckets describe "$BUCKET" >/dev/null 2>&1 || gcloud storage buckets create "$BUCKET" --location=us-central1 --uniform-bucket-level-access
          gcloud firebase test android run \
            --results-bucket "$BUCKET" \
            --type robo \
            --app realys-demo.apk \
            --device model=MediumPhone.arm,version=34,locale=pt_BR,orientation=portrait \
            --timeout 5m \
            ${LOGIN_ROBO:+--robo-directives "$LOGIN_ROBO"} \
            --format=json > resultado.json 2> saida.txt
          codigo=$?
          cat saida.txt
          {
            echo "### Relatório do Test Lab"
            echo
            grep -Eo 'https://console.firebase.google.com[^ ]+' saida.txt | head -1 | sed 's/^/Relatório completo (vídeo, prints, travamentos): /'
            echo
            echo '```'
            cat resultado.json
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit $codigo
