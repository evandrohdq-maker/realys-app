name: Gerar APK do Realys

# Roda sozinho a cada envio para a branch main, ou manualmente pela aba "Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Número desta versão. O app compara com o do GitHub para saber se há atualização.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências (versões compatíveis com o Expo)
        run: |
          npm install --legacy-peer-deps
          npx expo install --fix -- --legacy-peer-deps

      - name: Gravar o número da versão no app
        run: echo "{ \"build\": $BUILD_NUMBER }" > src/build.json

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/release/app-release.apk realys-demo.apk

      - name: Guardar APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: realys-demo-apk
          path: realys-demo.apk

      - name: Publicar APK na página de Releases (link para baixar no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-${{ github.run_number }}
          name: Realys demo ${{ github.run_number }}
          body: |
            APK de demonstração do Realys (versão ${{ github.run_number }}).
            Quem já tem o app instalado recebe o aviso de atualização ao abrir.
            Novidade: ${{ github.event.head_commit.message }}
          files: realys-demo.apk
          make_latest: true
