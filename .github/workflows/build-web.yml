name: Publicar o site do Re@lys

# O mesmo app do APK, no navegador. Roda a cada envio para a main (mudanças do app) ou pela aba "Actions".
# Publica no GitHub Pages, no domínio próprio https://realyz.com.br
# (Settings › Pages › Custom domain = realyz.com.br; DNS no Registro.br apontando para o GitHub Pages).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'server/**'
      - 'PENDENCIAS.md'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_BASE: ''
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências (com as do site)
        run: |
          npm install --legacy-peer-deps
          if npx expo install --fix -- --legacy-peer-deps > /tmp/fix.log 2>&1; then cat /tmp/fix.log; else cat /tmp/fix.log; grep -q "Cannot automatically write to dynamic config" /tmp/fix.log; fi
          npx expo install react-dom react-native-web @expo/metro-runtime -- --legacy-peer-deps || npm install --legacy-peer-deps react-dom react-native-web @expo/metro-runtime

      - name: Gravar o número da versão
        run: |
          echo "{ \"build\": $BUILD_NUMBER }" > src/build.json

      - name: Gerar o site
        run: npx expo export --platform web --output-dir dist
        env:
          CI: 1

      - name: Preparar para o GitHub Pages
        run: |
          cp dist/index.html dist/404.html   # qualquer endereço abre o app
          touch dist/.nojekyll
          echo "realyz.com.br" > dist/CNAME
          ls -la dist

      - name: Testar o site no navegador (erros e fotos da tela vão para a branch site-check)
        continue-on-error: true
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y > /dev/null && npm install playwright@1 > /dev/null && npx playwright install --with-deps chromium > /dev/null
          cd "$GITHUB_WORKSPACE"
          cp tools/site/smoke.mjs /tmp/pw/smoke.mjs
          node /tmp/pw/smoke.mjs "$GITHUB_WORKSPACE/dist" "$WEB_BASE" /tmp/check
          cd /tmp/check
          git init -q && git checkout -q -b site-check
          git -c user.name=ci -c user.email=ci@realys add -A && git -c user.name=ci -c user.email=ci@realys commit -qm "site-check ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site-check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Publicar: precisa do GitHub Pages ligado uma vez (Settings › Pages › Source: GitHub Actions).
  publicar:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
