plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.realysupdater'
version = '0.1.0'

android {
  namespace "expo.modules.realysupdater"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Para ajustar a ligação de rede do app (RealysUpdaterPackage.kt).
  implementation 'com.facebook.react:react-native:+'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
