<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:P;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf)}body{margin:0;background:#000}</style>
</head><body><canvas id="c" width="1024" height="1024"></canvas>
<script>
// Logo 3D do Re@lys: R dourado com volume (extrusão), faces metálicas e brilho, em preto e dourado.
const c = document.getElementById('c'), x = c.getContext('2d');
const S = 1024;

function bg(kind) {
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.clearRect(0, 0, S, S);
  if (kind === 'none') return;
  const g = x.createRadialGradient(S * 0.42, S * 0.36, 40, S / 2, S / 2, S * 0.78);
  g.addColorStop(0, '#2a2a2e'); g.addColorStop(0.55, '#0d0d0f'); g.addColorStop(1, '#000');
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  if (kind === 'ring') {
    // anel dourado 3D (lembra o @): várias camadas para dar volume
    for (let i = 18; i >= 0; i--) {
      x.beginPath(); x.arc(S / 2 + i * 0.9, S / 2 + i * 1.3, 410, 0, Math.PI * 2);
      x.lineWidth = 46; x.strokeStyle = shade(0.25 + (18 - i) * 0.012); x.stroke();
    }
    const rg = x.createLinearGradient(S * 0.2, S * 0.1, S * 0.8, S * 0.9);
    rg.addColorStop(0, '#FFF3B0'); rg.addColorStop(0.25, '#E9B730'); rg.addColorStop(0.5, '#8C5E06');
    rg.addColorStop(0.72, '#F4CF5A'); rg.addColorStop(1, '#7A4F00');
    x.beginPath(); x.arc(S / 2, S / 2, 410, 0, Math.PI * 2); x.lineWidth = 46; x.strokeStyle = rg; x.stroke();
    x.beginPath(); x.arc(S / 2, S / 2, 428, Math.PI * 1.05, Math.PI * 1.6); x.lineWidth = 5; x.strokeStyle = 'rgba(255,250,220,.85)'; x.stroke();
  }
}
function ringOnly() {
  for (let i = 18; i >= 0; i--) {
    x.beginPath(); x.arc(S / 2 + i * 0.9, S / 2 + i * 1.3, 410, 0, Math.PI * 2);
    x.lineWidth = 46; x.strokeStyle = shade(0.25 + (18 - i) * 0.012); x.stroke();
  }
  const rg = x.createLinearGradient(S * 0.2, S * 0.1, S * 0.8, S * 0.9);
  rg.addColorStop(0, '#FFF3B0'); rg.addColorStop(0.25, '#E9B730'); rg.addColorStop(0.5, '#8C5E06');
  rg.addColorStop(0.72, '#F4CF5A'); rg.addColorStop(1, '#7A4F00');
  x.beginPath(); x.arc(S / 2, S / 2, 410, 0, Math.PI * 2); x.lineWidth = 46; x.strokeStyle = rg; x.stroke();
  x.beginPath(); x.arc(S / 2, S / 2, 428, Math.PI * 1.05, Math.PI * 1.6); x.lineWidth = 5; x.strokeStyle = 'rgba(255,250,220,.85)'; x.stroke();
}
const shade = (k) => `rgb(${Math.round(150 * k + 40)},${Math.round(100 * k + 22)},${Math.round(10 * k)})`;

function letter(o) {
  const size = o.size || 700, cx = S / 2 + (o.dx || 0), cy = S / 2 + size * 0.36 + (o.dy || 0);
  x.font = `700 ${size}px P`; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  // sombra no chão
  x.save(); x.shadowColor = 'rgba(0,0,0,.85)'; x.shadowBlur = 60; x.shadowOffsetX = 30; x.shadowOffsetY = 45;
  x.fillStyle = '#000'; x.fillText('R', cx + o.depth, cy + o.depth * 1.3); x.restore();
  // extrusão: camadas do fundo para a frente, cada vez mais claras
  for (let i = o.depth; i > 0; i--) {
    const k = 1 - i / o.depth;
    x.fillStyle = o.sides === 'black' ? `rgb(${8 + k * 30},${8 + k * 28},${10 + k * 22})` : shade(0.35 + k * 0.45);
    x.fillText('R', cx + i * 0.75, cy + i);
  }
  // borda dourada fina entre a lateral e a frente
  x.lineJoin = 'round'; x.lineWidth = 10; x.strokeStyle = o.face === 'black' ? '#D9A62A' : '#6B4400'; x.strokeText('R', cx, cy);
  // frente
  const fg = x.createLinearGradient(cx - size * 0.35, cy - size * 0.75, cx + size * 0.3, cy + size * 0.05);
  if (o.face === 'black') {
    fg.addColorStop(0, '#4a4a50'); fg.addColorStop(0.35, '#121214'); fg.addColorStop(0.7, '#050506'); fg.addColorStop(1, '#2b2b30');
  } else {
    fg.addColorStop(0, '#FFF6C8'); fg.addColorStop(0.18, '#F7D56A'); fg.addColorStop(0.42, '#C48A12');
    fg.addColorStop(0.58, '#9A6608'); fg.addColorStop(0.78, '#F2C64C'); fg.addColorStop(1, '#B07A0C');
  }
  x.fillStyle = fg; x.fillText('R', cx, cy);
  // brilho no alto (bisel)
  x.save(); x.globalCompositeOperation = 'source-atop';
  const hl = x.createLinearGradient(0, cy - size * 0.75, 0, cy - size * 0.35);
  hl.addColorStop(0, o.face === 'black' ? 'rgba(255,230,160,.35)' : 'rgba(255,255,240,.55)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  x.restore();
  x.save(); x.beginPath(); x.rect(0, 0, S, cy - size * 0.38); x.clip(); x.globalAlpha = 0.5; x.fillStyle = hl; x.fillText('R', cx, cy); x.restore();
  x.lineWidth = 3; x.strokeStyle = o.face === 'black' ? 'rgba(255,214,110,.9)' : 'rgba(255,250,220,.7)'; x.strokeText('R', cx - 2, cy - 3);
}

function sparkle(px, py, r, a) {
  x.save(); x.translate(px, py); x.globalAlpha = a;
  const g = x.createRadialGradient(0, 0, 0, 0, 0, r * 1.6); g.addColorStop(0, 'rgba(255,245,200,.9)'); g.addColorStop(1, 'rgba(255,220,120,0)');
  x.fillStyle = g; x.beginPath(); x.arc(0, 0, r * 1.6, 0, 7); x.fill();
  x.fillStyle = '#FFFBE6'; x.beginPath();
  x.moveTo(0, -r); x.bezierCurveTo(r * .1, -r * .25, r * .25, -r * .1, r, 0); x.bezierCurveTo(r * .25, r * .1, r * .1, r * .25, 0, r);
  x.bezierCurveTo(-r * .1, r * .25, -r * .25, r * .1, -r, 0); x.bezierCurveTo(-r * .25, -r * .1, -r * .1, -r * .25, 0, -r); x.fill();
  x.restore();
}

async function render(o) {
  await document.fonts.load('700 100px P');
  if (o.fg) {
    // frente do ícone adaptativo: sem fundo e menor, dentro da área segura do Android
    x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, S, S);
    x.setTransform(o.fg, 0, 0, o.fg, S * (1 - o.fg) / 2, S * (1 - o.fg) / 2);
    ringOnly();
  } else bg(o.bg);
  letter(o);
  if (o.spark) sparkle(o.spark[0], o.spark[1], o.spark[2], 1);
  if (o.transparent) {
    // versão sem fundo (para a frente do ícone adaptativo do Android)
  }
  return c.toDataURL('image/png');
}
</script></body></html>
