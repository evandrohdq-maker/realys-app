<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1024" height="1024"></canvas>
<script>
// Logo do Re@lys, versão futurista: um R bem legível (haste, barriga e perna) dentro do @.
// A perna do R sai de dentro e atravessa a abertura do anel do @.
const c = document.getElementById('c'); let x = c.getContext('2d');
const S = 1024, C = 512, PI = Math.PI;

function bg(o) {
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.clearRect(0, 0, S, S);
  if (o.noBg) return;
  const g = x.createRadialGradient(S * 0.45, S * 0.4, 30, C, C, S * 0.75);
  if (o.space) { // universo: preto profundo, nebulosa dourada bem leve e estrelas
    x.fillStyle = '#020205'; x.fillRect(0, 0, S, S);
    const n1 = x.createRadialGradient(S * 0.3, S * 0.28, 10, S * 0.3, S * 0.28, S * 0.55);
    n1.addColorStop(0, 'rgba(120,80,20,0.35)'); n1.addColorStop(1, 'rgba(120,80,20,0)');
    x.fillStyle = n1; x.fillRect(0, 0, S, S);
    const n2 = x.createRadialGradient(S * 0.78, S * 0.8, 10, S * 0.78, S * 0.8, S * 0.5);
    n2.addColorStop(0, 'rgba(70,50,110,0.30)'); n2.addColorStop(1, 'rgba(70,50,110,0)');
    x.fillStyle = n2; x.fillRect(0, 0, S, S);
    let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    for (let i = 0; i < 260; i++) {
      const px = rnd() * S, py = rnd() * S, r = rnd() < 0.92 ? rnd() * 1.3 + 0.3 : rnd() * 2.2 + 1.2;
      x.globalAlpha = 0.35 + rnd() * 0.65; x.fillStyle = rnd() < 0.2 ? '#FFE7A8' : '#FFFFFF';
      x.beginPath(); x.arc(px, py, r, 0, 7); x.fill();
    }
    x.globalAlpha = 1;
    return;
  }
  if (o.goldBg) { // fundo dourado metálico
    g.addColorStop(0, '#FFE9A8'); g.addColorStop(0.35, '#E9B83A'); g.addColorStop(0.75, '#B07A0C'); g.addColorStop(1, '#7A5000');
  } else {
    g.addColorStop(0, '#24232a'); g.addColorStop(0.6, '#0b0b0e'); g.addColorStop(1, '#000');
  }
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  if (o.grid) { // grade de circuito bem sutil
    x.strokeStyle = o.goldBg ? 'rgba(90,60,0,0.08)' : 'rgba(226,182,73,0.06)'; x.lineWidth = 1;
    for (let i = 0; i <= S; i += 48) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, S); x.stroke(); x.beginPath(); x.moveTo(0, i); x.lineTo(S, i); x.stroke(); }
  }
}

// Partes do símbolo (cada uma é um traço).
function parts(o, dx = 0, dy = 0) {
  const R = o.ring, g0 = o.gap[0] * PI, g1 = o.gap[1] * PI;
  const sx = o.stemX + dx, top = o.top + dy, base = o.base + dy, bw = o.bowlW, br = o.bowlR;
  const midY = top + br * 2;
  const P = [];
  // anel do @ (em 2 segmentos, com um corte futurista no alto à esquerda)
  const cut = o.cut ? o.cut * PI : 0;
  if (o.cut) {
    P.push({ f: (p) => { p.beginPath(); p.arc(C + dx, C + dy, R, g1, 1.2 * PI - cut / 2, false); }, ends: [ang(R, g1, dx, dy), ang(R, 1.2 * PI - cut / 2, dx, dy)] });
    P.push({ f: (p) => { p.beginPath(); p.arc(C + dx, C + dy, R, 1.2 * PI + cut / 2, g0 + 2 * PI, false); }, ends: [ang(R, 1.2 * PI + cut / 2, dx, dy), ang(R, g0, dx, dy)] });
  } else if (!o.spiral) P.push({ f: (p) => { p.beginPath(); p.arc(C + dx, C + dy, R, g1, g0 + 2 * PI, false); }, ends: [] });
  // haste do R
  if (o.stem) P.push({ f: (p) => { p.beginPath(); p.moveTo(sx, o.stemToRing ? C + dy + Math.sqrt(R * R - (sx - dx - C) ** 2) : base); p.lineTo(sx, top); }, ends: o.stemToRing ? [] : [[sx, base]] });
  // barriga do R (formato de D): reta em cima, curva à direita, volta até a haste
  P.push({ f: (p) => {
    p.beginPath(); p.moveTo(sx, top); p.lineTo(sx + bw, top);
    p.arc(sx + bw, top + br, br, -PI / 2, PI / 2, false); p.lineTo(sx, midY);
  }, ends: o.stem ? [] : [[sx, top], [sx, midY]] });
  if (o.noLeg) return P; // sem a perna da direita
  // @ de verdade: a perna do R desce, faz a curva e vira o anel de fora (como o rabinho do @)
  if (o.spiral) {
    const lx = sx + o.legFrom, la = o.legAngle * PI;
    const cx = C + dx, cy = C + dy;
    // ponto onde a perna encontra o anel
    const px = lx - cx, py = midY - cy, ux = Math.cos(la), uy = Math.sin(la);
    const b = px * ux + py * uy, cc = px * px + py * py - R * R, t = -b + Math.sqrt(b * b - cc);
    const hit = Math.atan2(py + uy * t, px + ux * t);
    const pre = t - o.fillet; // a curva começa um pouco antes do anel
    const end = hit + o.spiralGap * PI; // o anel dá a volta e para um pouco antes de onde começou
        P.push({ f: (p) => {
      p.beginPath(); p.moveTo(lx, midY); p.lineTo(lx + ux * pre, midY + uy * pre);
      const a1 = hit + o.blend * PI; // entra no anel já seguindo a curva
      p.quadraticCurveTo(cx + Math.cos(hit) * R, cy + Math.sin(hit) * R, cx + Math.cos(a1) * R, cy + Math.sin(a1) * R);
      p.arc(cx, cy, R, a1, end + 2 * PI * (o.spiralDir > 0 ? 1 : 0), o.spiralDir < 0);
    }, ends: [] });
    return P;
  }
  // perna do R: nasce na barriga e sai pela abertura do @
  const lx = sx + o.legFrom, la = o.legAngle * PI;
  P.push({ f: (p) => { p.beginPath(); p.moveTo(lx, midY); p.lineTo(lx + Math.cos(la) * o.legLen, midY + Math.sin(la) * o.legLen); }, ends: [[lx + Math.cos(la) * o.legLen, midY + Math.sin(la) * o.legLen]] });
  return P;
}
const ang = (R, a, dx, dy) => [C + dx + Math.cos(a) * R, C + dy + Math.sin(a) * R];
const strokeAll = (P) => P.forEach((q) => (q.f(x), x.stroke()));
const gold = (k) => `rgb(${Math.round(150 * k + 40)},${Math.round(100 * k + 22)},${Math.round(10 * k)})`;
function metal(face) {
  const g = x.createLinearGradient(C - 360, C - 380, C + 300, C + 360);
  if (face === 'black') { g.addColorStop(0, '#4a4a52'); g.addColorStop(0.35, '#141418'); g.addColorStop(0.7, '#060608'); g.addColorStop(1, '#2b2b32'); }
  else { g.addColorStop(0, '#FFF6C8'); g.addColorStop(0.2, '#F7D56A'); g.addColorStop(0.45, '#C48A12'); g.addColorStop(0.6, '#9A6608'); g.addColorStop(0.8, '#F2C64C'); g.addColorStop(1, '#B07A0C'); }
  return g;
}

function render(o) {
  bg(o);
  if (o.scale) x.setTransform(o.scale, 0, 0, o.scale, S * (1 - o.scale) / 2, S * (1 - o.scale) / 2);
  x.lineCap = o.cap || 'butt'; x.lineJoin = o.join || 'miter';
  const W = o.width;
  if (o.hud) hud(o);
  if (o.globe) globe(o);
  if (o.halo) {
    const h = x.createRadialGradient(C - 20, C - 10, 40, C, C, 440);
    h.addColorStop(0, 'rgba(255,248,215,0.55)'); h.addColorStop(0.6, 'rgba(255,230,160,0.18)'); h.addColorStop(1, 'rgba(255,230,160,0)');
    x.fillStyle = h; x.beginPath(); x.arc(C, C, 460, 0, 7); x.fill();
  }
  if (o.style === 'neon') {
    // neon dourado: brilho largo + traço fino claro + nós nas pontas
    const P = parts(o);
    x.save(); x.shadowColor = 'rgba(255,190,60,0.9)'; x.shadowBlur = 40;
    x.strokeStyle = 'rgba(226,170,50,0.55)'; x.lineWidth = W; strokeAll(P); x.restore();
    x.strokeStyle = '#0b0b0e'; x.lineWidth = W - 16; strokeAll(P);
    x.save(); x.shadowColor = '#FFC94A'; x.shadowBlur = 18; x.strokeStyle = '#FFE7A3'; x.lineWidth = 5; strokeAll(P); x.restore();
    nodes(P, 13);
  } else {
    // 3D: sombra, volume, frente metálica (dourada ou preta com borda dourada) e brilho
    x.save(); x.shadowColor = 'rgba(0,0,0,.85)'; x.shadowBlur = 50; x.shadowOffsetX = 22; x.shadowOffsetY = 34;
    x.strokeStyle = '#000'; x.lineWidth = W; strokeAll(parts(o, o.depth, o.depth * 1.3)); x.restore();
    for (let i = o.depth; i > 0; i--) { const k = 1 - i / o.depth; x.strokeStyle = gold(0.32 + k * 0.5); x.lineWidth = W; strokeAll(parts(o, i * 0.75, i)); }
    const P = parts(o);
    if (o.face === 'black') { x.strokeStyle = '#D9A62A'; x.lineWidth = W; strokeAll(P); x.strokeStyle = metal('black'); x.lineWidth = W - 14; strokeAll(P); }
    else { x.strokeStyle = metal('gold'); x.lineWidth = W; strokeAll(P); }
    // linha de luz no meio do traço (efeito futurista)
    x.save(); x.shadowColor = '#FFD66B'; x.shadowBlur = 14;
    x.strokeStyle = o.face === 'black' ? 'rgba(255,214,110,0.95)' : 'rgba(255,252,230,0.85)'; x.lineWidth = 4; strokeAll(P); x.restore();
    if (o.nodes) nodes(P, 10);
  }
  if (o.stemStar) tallStar(o.stemStar);
  if (o.sweep) sweep(o);
  if (o.spark) sparkle(...o.spark);
  return c.toDataURL('image/png');
}
// Anéis finos de "painel futurista" em volta do @: traços, pontos de luz e marcações.
function hud(o) {
  const R = o.ring + o.width / 2 + 34;
  x.save(); x.lineCap = 'round';
  x.strokeStyle = 'rgba(40,26,0,0.55)'; x.lineWidth = 5;
  [[-0.92, -0.58], [-0.42, -0.08], [0.05, 0.22], [0.62, 0.9]].forEach(([a, b]) => { x.beginPath(); x.arc(C, C, R, a * PI, b * PI); x.stroke(); });
  x.strokeStyle = 'rgba(255,240,190,0.9)'; x.lineWidth = 2;
  [[-0.92, -0.58], [-0.42, -0.08], [0.05, 0.22], [0.62, 0.9]].forEach(([a, b]) => { x.beginPath(); x.arc(C, C, R, a * PI, b * PI); x.stroke(); });
  // marcações (como um mostrador)
  for (let i = 0; i < 48; i++) {
    const a = (i / 48) * 2 * PI, r1 = R + 14, r2 = R + (i % 4 === 0 ? 30 : 22);
    x.strokeStyle = i % 4 === 0 ? 'rgba(40,26,0,0.55)' : 'rgba(40,26,0,0.25)'; x.lineWidth = i % 4 === 0 ? 3 : 2;
    x.beginPath(); x.moveTo(C + Math.cos(a) * r1, C + Math.sin(a) * r1); x.lineTo(C + Math.cos(a) * r2, C + Math.sin(a) * r2); x.stroke();
  }
  // pontos de luz nas pontas dos traços
  [-0.92, -0.58, -0.42, -0.08, 0.05, 0.22, 0.62, 0.9].forEach((a) => {
    const px = C + Math.cos(a * PI) * R, py = C + Math.sin(a * PI) * R;
    x.shadowColor = '#FFF3C4'; x.shadowBlur = 16; x.fillStyle = '#FFFBEA'; x.beginPath(); x.arc(px, py, 6, 0, 7); x.fill();
  });
  x.restore();
}
// Globo terrestre em linhas (meridianos e paralelos) atrás do @: o Re@lys no mundo inteiro.
function globe(o) {
  const R = o.ring + o.width / 2 + 46, tilt = -0.32;
  x.save(); x.translate(C, C); x.rotate(tilt); x.lineCap = 'round';
  const line = o.space
    ? (draw, a = 0.5) => {
        // traço preto com luz dourada em volta (iluminado pelo "sol")
        x.save(); x.shadowColor = `rgba(255,200,90,${Math.min(1, a * 1.8)})`; x.shadowBlur = 16;
        x.strokeStyle = `rgba(255,205,110,${Math.min(1, a * 1.6)})`; x.lineWidth = 6; draw(); x.stroke(); x.restore();
        x.strokeStyle = '#050505'; x.lineWidth = 3.2; draw(); x.stroke();
      }
    : (draw, a = 0.5) => {
        x.strokeStyle = `rgba(60,38,0,${Math.min(1, a * 1.5)})`; x.lineWidth = 5; draw(); x.stroke();
        x.strokeStyle = "rgba(255,246,210,0.8)"; x.lineWidth = 2; draw(); x.stroke();
      };
  // globo escuro, com a borda acesa como um planeta contra o sol
  if (o.space) {
    const body = x.createRadialGradient(-R * 0.35, -R * 0.4, R * 0.1, 0, 0, R);
    body.addColorStop(0, 'rgba(40,30,10,0.95)'); body.addColorStop(0.7, 'rgba(8,8,12,0.95)'); body.addColorStop(1, 'rgba(0,0,0,0.95)');
    x.fillStyle = body; x.beginPath(); x.arc(0, 0, R, 0, 7); x.fill();
    const rim = x.createLinearGradient(-R, -R, R, R); rim.addColorStop(0, 'rgba(255,225,150,0.95)'); rim.addColorStop(0.5, 'rgba(255,190,80,0.25)'); rim.addColorStop(1, 'rgba(255,190,80,0)');
    x.save(); x.shadowColor = '#FFD27A'; x.shadowBlur = 40; x.strokeStyle = rim; x.lineWidth = 6; x.beginPath(); x.arc(0, 0, R, 0, 7); x.stroke(); x.restore();
  }
  // contorno do globo
  line(() => { x.beginPath(); x.arc(0, 0, R, 0, 7); }, 0.55);
  // paralelos
  for (let i = -3; i <= 3; i++) {
    const y = (i / 4) * R, w = Math.sqrt(R * R - y * y);
    line(() => { x.beginPath(); x.ellipse(0, y, w, w * 0.16, 0, 0, 7); }, i === 0 ? 0.5 : 0.32);
  }
  // meridianos
  for (let i = 0; i < 6; i++) {
    const w = Math.abs(Math.cos((i / 6) * PI)) * R;
    line(() => { x.beginPath(); x.ellipse(0, 0, Math.max(2, w), R, 0, 0, 7); }, 0.32);
  }
  // órbita com satélite de luz (toque futurista)
  x.rotate(0.9);
  line(() => { x.beginPath(); x.ellipse(0, 0, R + 60, (R + 60) * 0.28, 0, 0, 7); }, 0.4);
  x.shadowColor = '#FFF3C4'; x.shadowBlur = 18; x.fillStyle = '#FFFBEA'; x.beginPath(); x.arc(R + 60, 0, 9, 0, 7); x.fill();
  x.restore();
}
// Reflexo de luz correndo pelo anel (no alto à direita).
function sweep(o) {
  const R = o.ring;
  x.save(); x.lineCap = 'round';
  const g = x.createLinearGradient(C + R * Math.cos(-0.75 * PI), C + R * Math.sin(-0.75 * PI), C + R * Math.cos(-0.1 * PI), C + R * Math.sin(-0.1 * PI));
  g.addColorStop(0, 'rgba(255,250,220,0)'); g.addColorStop(0.5, 'rgba(255,250,225,0.95)'); g.addColorStop(1, 'rgba(255,250,220,0)');
  x.shadowColor = '#FFE9A8'; x.shadowBlur = 22; x.strokeStyle = g; x.lineWidth = 9;
  x.beginPath(); x.arc(C, C, R, -0.75 * PI, -0.1 * PI); x.stroke();
  x.restore();
}
function nodes(P, r) {
  P.forEach((q) => (q.ends || []).forEach(([px, py]) => {
    x.save(); x.shadowColor = '#FFC94A'; x.shadowBlur = 20; x.fillStyle = '#FFF1C2';
    x.beginPath(); x.arc(px, py, r, 0, 7); x.fill(); x.restore();
  }));
}
// Estrela no lugar da haste do R: estrela de 4 pontas alongada (alta e fina), dourada e brilhante.
function tallStar({ x: px, y: py, rx, ry, glow = 1 }) {
  x.save(); x.translate(px, py);
  const g = x.createRadialGradient(0, 0, 0, 0, 0, ry * 0.9); g.addColorStop(0, `rgba(255,225,140,${0.55 * glow})`); g.addColorStop(1, 'rgba(255,200,90,0)');
  x.fillStyle = g; x.beginPath(); x.ellipse(0, 0, rx * 3, ry * 0.9, 0, 0, 7); x.fill();
  const path = () => {
    x.beginPath();
    x.moveTo(0, -ry); x.quadraticCurveTo(rx * 0.18, -ry * 0.18, rx, 0); x.quadraticCurveTo(rx * 0.18, ry * 0.18, 0, ry);
    x.quadraticCurveTo(-rx * 0.18, ry * 0.18, -rx, 0); x.quadraticCurveTo(-rx * 0.18, -ry * 0.18, 0, -ry); x.closePath();
  };
  if (arguments[0].matchStrokes) {
    // mesma "pele" dos traços: corpo preto, borda dourada e luz no meio, para parecer uma peça só
    x.save(); x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = 24; x.shadowOffsetX = 10; x.shadowOffsetY = 14;
    x.fillStyle = '#D9A62A'; path(); x.fill(); x.restore();
    const body = x.createLinearGradient(-rx, -ry, rx, ry); body.addColorStop(0, '#4a4a52'); body.addColorStop(0.4, '#121216'); body.addColorStop(1, '#2b2b32');
    x.save(); x.scale(0.8, 0.94); x.fillStyle = body; path(); x.fill(); x.restore();
    x.save(); x.shadowColor = '#FFD66B'; x.shadowBlur = 18; x.fillStyle = '#FFE9A8'; x.scale(0.22, 0.8); path(); x.fill(); x.restore();
    x.fillStyle = '#FFFDF2'; x.scale(0.12, 0.35); path(); x.fill();
  } else {
    const fg = x.createLinearGradient(0, -ry, 0, ry); fg.addColorStop(0, '#FFF8DC'); fg.addColorStop(0.45, '#F4CF5A'); fg.addColorStop(0.55, '#FFF3C4'); fg.addColorStop(1, '#C48A12');
    x.shadowColor = '#FFC94A'; x.shadowBlur = 30; x.fillStyle = fg; path(); x.fill();
    x.shadowBlur = 0; x.fillStyle = '#FFFDF2'; x.scale(0.35, 0.55); path(); x.fill();
  }
  x.restore();
}
function sparkle(px, py, r) {
  x.save(); x.translate(px, py);
  const g = x.createRadialGradient(0, 0, 0, 0, 0, r * 1.6); g.addColorStop(0, 'rgba(255,245,200,.9)'); g.addColorStop(1, 'rgba(255,220,120,0)');
  x.fillStyle = g; x.beginPath(); x.arc(0, 0, r * 1.6, 0, 7); x.fill();
  x.fillStyle = '#FFFBE6'; x.beginPath();
  x.moveTo(0, -r); x.bezierCurveTo(r * .1, -r * .25, r * .25, -r * .1, r, 0); x.bezierCurveTo(r * .25, r * .1, r * .1, r * .25, 0, r);
  x.bezierCurveTo(-r * .1, r * .25, -r * .25, r * .1, -r, 0); x.bezierCurveTo(-r * .25, -r * .1, -r * .1, -r * .25, 0, -r); x.fill();
  x.restore();
}

// ---------- Conceitos novos ----------
// Desenha o símbolo (R dentro do @, traço único) numa tela à parte, como máscara.
function maskOf(o, w) {
  const m = document.createElement('canvas'); m.width = S; m.height = S; const mx = m.getContext('2d');
  const keep = x; x = mx; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#fff'; x.lineWidth = w;
  strokeAll(parts({ ...o }));
  x = keep; return m;
}
function fingerprint(ctx, cx, cy, color, step = 11, lw = 3.2) {
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  for (let r = 8; r < 560; r += step) {
    ctx.beginPath();
    for (let a = 0; a <= 2 * PI + 0.01; a += 0.02) {
      const wob = Math.sin(a * 3 + r * 0.05) * 3 + Math.sin(a * 7 + r * 0.11) * 1.5;
      const rx = (r + wob) * 0.86, ry = (r + wob) * 1.08;
      const px = cx + Math.cos(a) * rx, py = cy + Math.sin(a) * ry;
      a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
}
function blackBg() {
  x.setTransform(1, 0, 0, 1, 0, 0);
  const g = x.createRadialGradient(S * 0.45, S * 0.4, 30, C, C, S * 0.75);
  g.addColorStop(0, '#1d1c22'); g.addColorStop(0.6, '#08080a'); g.addColorStop(1, '#000');
  x.fillStyle = g; x.fillRect(0, 0, S, S);
}
function goldGrad() {
  const g = x.createLinearGradient(C - 360, C - 380, C + 300, C + 360);
  g.addColorStop(0, '#FFF6C8'); g.addColorStop(0.25, '#F2C64C'); g.addColorStop(0.5, '#B9840E'); g.addColorStop(0.75, '#F7D56A'); g.addColorStop(1, '#A6730A');
  return g;
}
function concept(o) {
  blackBg();
  const k = o.kind;
  if (k === 'digital') {
    // R@ feito de linhas de impressão digital: a identidade de pessoa real, que é o coração do Re@lys
    const m = maskOf(o, o.width);
    const t = document.createElement('canvas'); t.width = S; t.height = S; const tx = t.getContext('2d');
    const keep = x; x = tx; const gg = goldGrad(); x = keep;
    tx.fillStyle = '#0a0a0c'; tx.fillRect(0, 0, S, S);
    fingerprint(tx, C - 20, C + 20, gg, 13, 4.5);
    tx.globalCompositeOperation = 'destination-in'; tx.drawImage(m, 0, 0);
    x.save(); x.shadowColor = 'rgba(255,200,80,0.55)'; x.shadowBlur = 30; x.drawImage(t, 0, 0); x.restore();
    x.drawImage(t, 0, 0);
    // contorno fino dourado por fora do traço
    const e = maskOf(o, o.width + 8); const ex = e.getContext('2d'); ex.globalCompositeOperation = 'destination-out'; ex.drawImage(maskOf(o, o.width + 2), 0, 0);
    ex.globalCompositeOperation = 'source-in'; ex.fillStyle = '#E9B83A'; ex.fillRect(0, 0, S, S);
    x.drawImage(e, 0, 0);
  } else if (k === 'scan') {
    // reconhecimento facial: cantoneiras de scan (como o Face ID), R@ dourado e a linha de leitura passando

    x.fillStyle = fade; x.fillRect(120, ly - 140, S - 240, 140);
  } else if (k === 'mono') {

    h.addColorStop(0.62, '#FFF1C9'); h.addColorStop(0.8, '#E8B23C'); h.addColorStop(1, '#8A5D06');
    x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = h; x.lineWidth = o.width; strokeAll(parts({ ...o }));
    x.globalAlpha = 0.85; x.strokeStyle = 'rgba(255,255,255,0.9)'; x.lineWidth = o.width * 0.16; strokeAll(parts({ ...o }, -o.width * 0.22, -o.width * 0.26)); x.globalAlpha = 1;
    x.strokeStyle = 'rgba(90,55,0,0.45)'; x.lineWidth = o.width * 0.12; strokeAll(parts({ ...o }, o.width * 0.25, o.width * 0.28));
    sparkle(o.spark[0], o.spark[1], o.spark[2]);
  }
  return c.toDataURL('image/png');
}
